name: judge0

services:
  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    env_file: judge0.conf
    networks:
      - internal
    restart: unless-stopped

  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      # 覆盖语言种子，给 Java/Node 加上堆上限参数（rlimit 模式必需）
      - ./seeds.rb:/api/db/seeds.rb:ro
    environment:
      # judge0.conf 未显式设置时，用该值作为编译阶段与提交内存的上限。
      # 默认 1.6GB 才能让 JVM 在 RLIMIT_AS 下启动。
      MAX_MEMORY_LIMIT: ${OJ_MAX_MEMORY_LIMIT:-1600000}
    privileged: true
    ports:
      - "127.0.0.1:2358:2358"
    networks:
      internal:
      link:
        aliases:
          - judge0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      MAX_MEMORY_LIMIT: ${OJ_MAX_MEMORY_LIMIT:-1600000}
    privileged: true
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
    restart: unless-stopped

networks:
  internal:
    internal: true
    driver_opts:
      com.docker.network.bridge.name: judge0int0
  link:
    external: true
    name: judge0-link

volumes:
  judge0-db-data:
