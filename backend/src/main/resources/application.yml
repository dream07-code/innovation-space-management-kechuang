spring:
  application:
    name: innovation-space-backend
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:innovation_space}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 一场考核 50 人同时交卷时，每个请求至少占一个连接；池子太小会直接超时并
      # 被 schema 守卫翻译成 503。20 个连接在 2G 机器上仍是可接受的开销。
      connection-timeout: 5000
      validation-timeout: 1000
      initialization-fail-timeout: -1
      minimum-idle: 5
      maximum-pool-size: 20
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false
  servlet:
    multipart:
      # 日报/周报笔记图片：前端会先压到 1600px 再传，这里按原始上限兜底。
      max-file-size: 10MB
      max-request-size: 12MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

app:
  migration:
    mode: disabled
    required-version: "18"
  auth:
    initial-password: ${MEMBER_INITIAL_PASSWORD:}
  report:
    points-policy-status: ${REPORT_POINTS_POLICY_STATUS:PENDING_CONFIRMATION}
    points-mode: ${REPORT_POINTS_MODE:FINAL_SCORE}
    max-final-score: ${REPORT_MAX_FINAL_SCORE:3}
    daily-base-points: ${REPORT_DAILY_BASE_POINTS:1}
    weekly-base-points: ${REPORT_WEEKLY_BASE_POINTS:1}
  oj:
    # mock=假判题；judge0=远程判题机；local=本机 g++/javac/python3/node 真实编译执行（仅开发环境）
    provider: ${OJ_PROVIDER:mock}
    base-url: ${OJ_BASE_URL:}
    api-token: ${OJ_API_TOKEN:}
    connect-timeout-ms: ${OJ_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${OJ_REQUEST_TIMEOUT_MS:30000}
    cpu-time-limit-seconds: ${OJ_CPU_TIME_LIMIT_SECONDS:2}
    memory-limit-kb: ${OJ_MEMORY_LIMIT_KB:128000}
    runtime-memory-limit-kb: ${OJ_RUNTIME_MEMORY_LIMIT_KB:1500000}
    max-response-bytes: ${OJ_MAX_RESPONSE_BYTES:1048576}
    use-rlimit-fallback: ${OJ_RLIMIT_FALLBACK:false}
  membership:
    auto-removal-enabled: ${MEMBERSHIP_AUTO_REMOVAL_ENABLED:true}
    removal-check-interval-ms: ${MEMBERSHIP_REMOVAL_CHECK_INTERVAL_MS:3600000}
    removal-batch-size: ${MEMBERSHIP_REMOVAL_BATCH_SIZE:500}
  storage:
    # 日报/周报笔记图片：腾讯云 COS。密钥只从环境变量注入，绝不写进仓库。
    cos:
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:kckj-1330648838}
      region: ${COS_REGION:ap-beijing}
      domain: ${COS_DOMAIN:https://kckj-1330648838.cos.ap-beijing.myqcloud.com}
      key-prefix: ${COS_KEY_PREFIX:reports}
      connect-timeout-ms: ${COS_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${COS_REQUEST_TIMEOUT_MS:30000}
  ai:
    enabled: ${AI_SCORING_ENABLED:false}
    provider: ${AI_PROVIDER:disabled}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:30000}
    max-retries: ${AI_MAX_RETRIES:2}
    max-concurrency: ${AI_MAX_CONCURRENCY:2}
    poll-interval-ms: ${AI_POLL_INTERVAL_MS:1000}
    worker-scheduling-enabled: ${AI_WORKER_SCHEDULING_ENABLED:true}

mybatis-plus:
  configuration:
    call-setters-on-nulls: true
    local-cache-scope: STATEMENT
