spring:
  application:
    name: innovation-space-backend
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:innovation_space}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  web:
    resources:
      add-mappings: false
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
