    SystemRules:
      type: object
      required:
      - businessTimezone
      - reportPolicy
      - inactivityPolicy
      - restorePolicy
      properties:
        businessTimezone:
          type: string
          enum:
          - Asia/Shanghai
        reportPolicy:
          type: object
          required:
          - configStatus
          - version
          - dailyBasePoints
          - weeklyBasePoints
          - maxFinalScore
          - allowBackfill
          - dailyEditPolicy
          - weeklyEditPolicy
          properties:
            configStatus:
              type: string
              enum:
              - PENDING_CONFIRMATION
              - READY
            version:
              type: string
              nullable: true
            dailyBasePoints:
              type: integer
              format: int32
              minimum: 1
              maximum: 1
              nullable: true
            weeklyBasePoints:
              type: integer
              format: int32
              minimum: 1
              maximum: 1
              nullable: true
            maxFinalScore:
              type: integer
              format: int32
              minimum: 3
              maximum: 3
              nullable: true
            allowBackfill:
              type: boolean
              nullable: true
            dailyEditPolicy:
              type: string
              enum:
              - SAME_DAY
              - null
              nullable: true
            weeklyEditPolicy:
              type: string
              enum:
              - SAME_WEEK
              - null
              nullable: true
        inactivityPolicy:
          type: object
          required:
          - configStatus
          - enabled
          - thresholdDays
          - clockPolicy
          properties:
            configStatus:
              type: string
              enum:
              - PENDING_CONFIRMATION
              - READY
            enabled:
              type: boolean
              example: true
            thresholdDays:
              type: integer
              format: int32
              minimum: 14
              maximum: 14
            clockPolicy:
              type: string
              enum:
              - FULL_CALENDAR_DAYS
        restorePolicy:
          type: object
          required:
          - configStatus
          - retainHistoricalPointEntries
          - resetNetPoints
          properties:
            configStatus:
              type: string
              enum:
              - READY
            retainHistoricalPointEntries:
              type: boolean
              enum:
              - true
            resetNetPoints:
              type: boolean
              enum:
              - true
    SystemRulesResponse:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
          example: Success
        data:
          $ref: '#/components/schemas/SystemRules'
