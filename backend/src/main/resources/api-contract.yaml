openapi: 3.0.3
info:
  title: 学院科创空间管理系统 API 契约
  version: 1.0.0-draft
  description: 前后端并行开发的设计契约。以每条路径的x-implementation-status为准；OJ考核路径可先用planned DTO和Mock开发，真实OJ私有字段不进入前端。登录身份规则已确认，其余政策看x-rule-status和README。示例均虚构，不含真实初始密码。
x-frontend-contract:
  baseline: backend
  mockWorkflow:
    enabled: true
    rule: 前端按 planned DTO 建 Mock；真实 OJ、AI 和数据库联调前不猜测私有字段。
    assessmentStates: [DRAFT, PUBLISHED, CLOSED, ARCHIVED]
    submissionStates: [RECEIVED, JUDGING, JUDGED, FAILED, NEEDS_REVIEW]
    evaluationStates: [PENDING, COMPLETE, FAILED, NEEDS_REVIEW]
    resultStates: [PENDING, COMPLETE, NEEDS_REVIEW]
  roleMatrix:
    COLLEGE_ADMIN: [assessment.manage, problem.manage, submission.read, evaluation.read, review.manage, result.read]
    DIRECTION_LEADER: [assessment.manage.scope, problem.manage, submission.read.scope, evaluation.read.scope, review.manage.scope, result.read.scope]
    STUDENT: [assessment.read.published, problem.read.published, submission.create.own, submission.read.own, evaluation.read.own, result.read.own]
  errorCodes: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INVALID_STATE, VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, SERVICE_UNAVAILABLE]
  privacy:
    neverExpose: [code, codeText, codeLocator, privateTestData, rawProviderResponse, apiToken, password]
    idFormat: 十进制字符串；前端不得转换为 JavaScript Number。
  idempotency:
    requiredFor: [assessment.create, assessment.publish, assessment.close, submission.create, review.create]
    header: Idempotency-Key
servers:
- url: /
  description: 相对当前origin；导入Mock工具后替换为Mock/联调地址，勿重复/api/v1前缀。
tags:
- name: 认证
- name: 方向
- name: 成员
- name: 负责人
- name: 日报
- name: 周报
- name: 评分复核
- name: 积分
- name: 排行榜
- name: 数据看板
- name: OJ考核
- name: OJ题目
- name: OJ提交
- name: OJ评分
- name: 规则
- name: 审计
- name: 运行状态
security:
- BearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - 认证
      operationId: login
      summary: 账号密码登录
      description: 管理员账号由项目负责人指定；学生/负责人用学号。无自注册或自动开户。错误账号/密码/被禁用账号登录统一401 INVALID_CREDENTIALS。待改密登录返回受限 access token、refreshToken=null、mustChangePassword=true；仅可访问
        me/password/logout。
      x-implementation-status: implemented
      x-roles: []
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                normal:
                  summary: 正常登录（不可用的合成token）
                  value:
                    code: OK
                    message: Success
                    data:
                      accessToken: mock-access-token-not-a-credential
                      refreshToken: mock-refresh-token-not-a-credential
                      tokenType: Bearer
                      expiresIn: 900
                      refreshExpiresIn: 604800
                      mustChangePassword: false
                      user:
                        userId: '101'
                        memberId: '201'
                        account: MOCK20260001
                        displayName: 示例同学
                        role: STUDENT
                        directionId: '1'
                        managedDirectionIds: []
                passwordChangeRequired:
                  summary: 受限首次登录
                  value:
                    code: OK
                    message: Success
                    data:
                      accessToken: mock-limited-token-not-a-credential
                      refreshToken: null
                      tokenType: Bearer
                      expiresIn: 300
                      refreshExpiresIn: null
                      mustChangePassword: true
                      user:
                        userId: '101'
                        memberId: '201'
                        account: MOCK20260001
                        displayName: 示例同学
                        role: STUDENT
                        directionId: '1'
                        managedDirectionIds: []
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: MOCK20260001
              password: Example-Only9!
  /api/v1/auth/refresh:
    post:
      tags:
      - 认证
      operationId: refreshSession
      summary: 轮换刷新令牌
      description: 请求体携带 refresh token，不要求 access token。轮换旧 refresh token 并重新验证状态/权限；重放则撤销 session 并401。受限待改密 session
        不发 refresh token；其状态不能绕过改密。
      x-implementation-status: implemented
      x-roles: []
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                code: OK
                message: Success
                data:
                  accessToken: mock-access-token-not-a-credential
                  refreshToken: mock-refresh-token-not-a-credential
                  tokenType: Bearer
                  expiresIn: 900
                  refreshExpiresIn: 604800
                  mustChangePassword: false
                  user:
                    userId: '101'
                    memberId: '201'
                    account: MOCK20260001
                    displayName: 示例同学
                    role: STUDENT
                    directionId: '1'
                    managedDirectionIds: []
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: mock-refresh-token-not-a-credential
  /api/v1/auth/logout:
    post:
      tags:
      - 认证
      operationId: logout
      summary: 退出当前会话
      description: 包括受限待改密 token；撤销当前 session 的 access/refresh。已失效 token 返回401，客户端仍清除本地状态。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      - STUDENT
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
              example:
                code: OK
                message: Success
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/me:
    get:
      tags:
      - 认证
      operationId: getMe
      summary: 当前登录身份和本人资料
      description: 待改密 token 可访问；身份和 managedDirectionIds 以服务端现状为准。管理员 memberId 和学生字段可为 null。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      - STUDENT
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                code: OK
                message: Success
                data:
                  user:
                    userId: '101'
                    memberId: '201'
                    account: MOCK20260001
                    displayName: 示例同学
                    role: STUDENT
                    directionId: '1'
                    managedDirectionIds: []
                  mustChangePassword: false
                  accountStatus: ENABLED
                  membershipStatus: ACTIVE
                  profile:
                    studentNo: MOCK20260001
                    major: null
                    className: null
                    grade: null
                    contact: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/password:
    put:
      tags:
      - 认证
      operationId: changePassword
      summary: 修改本人密码并撤销全部会话
      description: 允许受限待改密 token；成功后必须重新登录，旧 access/refresh 全部失效。oldPassword错误400 OLD_PASSWORD_INVALID；不合新密码策略400
        PASSWORD_POLICY_VIOLATION。不返回密码或新 token。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      - STUDENT
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
              example:
                code: OK
                message: Success
                data: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldPassword: Example-Only9!
              newPassword: Changed-Example9!
  /api/v1/directions:
    get:
      tags:
      - 方向
      operationId: listDirections
      summary: 方向目录
      description: 按固定目录顺序返回七个方向，不包括人数、负责人学号或联系方式。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      - STUDENT
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionListResponse'
              example:
                code: OK
                message: Success
                data:
                - id: '1'
                  code: AI_FULLSTACK
                  name: AI 全栈
                  enabled: true
                - id: '2'
                  code: HARMONY_OS
                  name: 鸿蒙
                  enabled: true
                - id: '3'
                  code: CYBER_SECURITY
                  name: 网络安全
                  enabled: true
                - id: '4'
                  code: CPP
                  name: C++
                  enabled: true
                - id: '5'
                  code: BIG_DATA
                  name: 大数据
                  enabled: true
                - id: '6'
                  code: ARTIFICIAL_INTELLIGENCE
                  name: 人工智能
                  enabled: true
                - id: '7'
                  code: PROJECT_DESIGN
                  name: 项目创意设计
                  enabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/directions/{directionId}:
    get:
      tags:
      - 方向
      operationId: getDirection
      summary: 方向详情
      description: ''
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      - STUDENT
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectionResponse'
              example:
                code: OK
                message: Success
                data:
                  id: '1'
                  code: AI_FULLSTACK
                  name: AI 全栈
                  enabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: directionId
        in: path
        required: true
        schema:
          type: string
          description: 十进制字符串 ID，不转换为 JavaScript Number。
          pattern: ^[1-9][0-9]{0,18}$
          example: '201'

  /api/v1/members:
    get:
      tags:
      - 成员
      operationId: listMembers
      summary: 管理端成员列表
      description: 学院管理员全方向；负责人只看所辖方向普通学生，不能查看其他负责人资料。先授权过滤再计算total。按 createdAt DESC,id数值 DESC。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPageResponse'
              example:
                code: OK
                message: Success
                data:
                  items: []
                  page: 1
                  size: 20
                  total: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: directionId
        in: query
        required: false
        description: ''
        schema:
          type: string
          description: 十进制字符串 ID，不转换为 JavaScript Number。
          pattern: ^[1-9][0-9]{0,18}$
          example: '201'

      - name: keyword
        in: query
        required: false
        description: 姓名/学号模糊搜索；禁止记录原始搜索值。
        schema:
          type: string
          maxLength: 100
      - name: status
        in: query
        required: false
        description: 不传返回权限范围内全部状态。
        schema:
          type: string
          enum:
          - ACTIVE
          - REMOVED
    post:
      tags:
      - 成员
      operationId: createMember
      summary: 添加学生并创建账号
      description: 固定创建 STUDENT，初始积分0、mustChangePassword=true；密码从私密配置读取不返回。负责人仅可添加到其 managedDirectionIds。学号/统一account重复409
        ACCOUNT_ALREADY_EXISTS；禁止提交role/password/points。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      responses:
        '201':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              example:
                code: OK
                message: Success
                data:
                  id: '201'
                  userId: '101'
                  studentNo: MOCK20260001
                  name: 示例同学
                  major: null
                  className: null
                  grade: null
                  contact: null
                  role: STUDENT
                  directionId: '1'
                  managedDirectionIds: []
                  membershipStatus: ACTIVE
                  accountStatus: ENABLED
                  mustChangePassword: true
                  joinedAt: '2026-10-11T09:00:00+08:00'
                  membershipStartedAt: '2026-10-11T09:00:00+08:00'
                  removedAt: null
                  removalReason: null
                  totalPoints: 0
                  version: 1
                  createdAt: '2026-10-11T09:00:00+08:00'
                  updatedAt: '2026-10-11T09:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
            example:
              studentNo: MOCK20260001
              name: 示例同学
              directionId: '1'
  /api/v1/members/{memberId}:
    get:
      tags:
      - 成员
      operationId: getMember
      summary: 管理端成员详情
      description: 管理员所有成员；负责人仅所辖普通学生。学生查看自己使用auth/me，不开放全量人员字段给排行榜。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              example:
                code: OK
                message: Success
                data:
                  id: '201'
                  userId: '101'
                  studentNo: MOCK20260001
                  name: 示例同学
                  major: null
                  className: null
                  grade: null
                  contact: null
                  role: STUDENT
                  directionId: '1'
                  managedDirectionIds: []
                  membershipStatus: ACTIVE
                  accountStatus: ENABLED
                  mustChangePassword: false
                  joinedAt: '2026-10-11T09:00:00+08:00'
                  membershipStartedAt: '2026-10-11T09:00:00+08:00'
                  removedAt: null
                  removalReason: null
                  totalPoints: 0
                  version: 1
                  createdAt: '2026-10-11T09:00:00+08:00'
                  updatedAt: '2026-10-11T09:00:00+08:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          description: 十进制字符串 ID，不转换为 JavaScript Number。
          pattern: ^[1-9][0-9]{0,18}$
          example: '201'

    patch:
      tags:
      - 成员
      operationId: updateMember
      summary: 更新学生资料
      description: 仅STUDENT；负责人只改所辖普通学生资料，不能改directionId；学院管理员可改学生方向。学号/角色/积分不允许此接口写入，负责人资料走专用接口。version冲突409；方向调整保留历史报告/快照归属，活动月评期间拒绝调方向409
        INVALID_STATE。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              example:
                code: OK
                message: Success
