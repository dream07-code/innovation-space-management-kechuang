      description: 仅学生个人排名；方向负责人和学院管理员无此资源。
      type: object
      required:
      - memberId
      - directionId
      - period
      - month
      - points
      - overallRank
      - directionRank
      - overallCount
      - directionCount
      - eligible
      - asOf
      properties:
        memberId:
          type: string
          description: 十进制字符串 ID，不转换为 JavaScript Number。
          pattern: ^[1-9][0-9]{0,18}$
          example: '201'
        directionId:
          type: string
          description: 十进制字符串 ID，不转换为 JavaScript Number。
          pattern: ^[1-9][0-9]{0,18}$
          example: '201'
        period:
          type: string
          enum:
          - ALL_TIME
          - MONTH
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-10
          nullable: true
        points:
          type: integer
          format: int32
          minimum: 0
          example: 3
        overallRank:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        directionRank:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        overallCount:
          type: integer
          format: int32
          minimum: 0
        directionCount:
          type: integer
          format: int32
          minimum: 0
        eligible:
          type: boolean
        asOf:
          type: string
          format: date-time
          example: '2026-10-11T09:00:00+08:00'
    MyRankingResponse:
      type: object
      required:
      - code
      - message
      - data
      properties:
        code:
          type: string
          enum:
          - OK
        message:
          type: string
          example: Success
        data:
          $ref: '#/components/schemas/MyRanking'
