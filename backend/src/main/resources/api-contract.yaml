components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: access token；客户端视为不透明字符串。受限改密token不具备一般业务权限。
  parameters:
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    ProblemId:
      name: problemId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]{0,18}$
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID；同一用户+方法+路径+key 的成功结果保留24小时，同 key 不同请求体409。
      schema:
        type: string
        format: uuid
        example: 11111111-1111-4111-8111-111111111111
  responses:
    BadRequest:
      description: HTTP 400；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REQUEST
            message: Request could not be completed
            data: null
    Unauthorized:
      description: HTTP 401；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Request could not be completed
            data: null
    Forbidden:
      description: HTTP 403；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Request could not be completed
            data: null
    NotFound:
      description: HTTP 404；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Request could not be completed
            data: null
    MethodNotAllowed:
      description: HTTP 405；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: METHOD_NOT_ALLOWED
            message: Request could not be completed
            data: null
      headers:
        Allow:
          schema:
            type: string
          description: 资源支持的 HTTP 方法。
    Conflict:
      description: HTTP 409；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VERSION_CONFLICT
            message: Request could not be completed
            data: null
    UnsupportedMediaType:
      description: HTTP 415；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REQUEST
            message: Request could not be completed
            data: null
    TooManyRequests:
      description: HTTP 429；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RATE_LIMITED
            message: Request could not be completed
            data: null
      headers:
        Retry-After:
          schema:
            type: integer
            format: int32
            minimum: 1
          description: 建议等待秒数。
    InternalError:
      description: HTTP 500；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Request could not be completed
            data: null
    Unavailable:
      description: HTTP 503；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RULES_NOT_CONFIGURED
            message: Request could not be completed
            data: null
