components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: access token；客户端视为不透明字符串。受限改密token不具备一般业务权限。
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID；同一用户+方法+路径+key 的成功结果保留24小时，同 key 不同请求体409。
      schema:
        type: string
        format: uuid
        example: 11111111-1111-4111-8111-111111111111
  responses:
    BadRequest:
      description: HTTP 400；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_REQUEST
            message: Request could not be completed
            data: null
    Unauthorized:
      description: HTTP 401；业务细分错误码见 ErrorResponse 和中文说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
