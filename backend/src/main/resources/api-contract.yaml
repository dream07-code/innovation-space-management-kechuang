      operationId: updateMember
      summary: 更新学生资料
      description: 仅STUDENT；负责人只改所辖普通学生资料，不能改directionId；学院管理员可改学生方向。学号/角色/积分不允许此接口写入，负责人资料走专用接口。version冲突409；方向调整保留历史报告/快照归属，活动月评期间拒绝调方向409
        INVALID_STATE。
      x-implementation-status: implemented
      x-roles:
      - COLLEGE_ADMIN
      - DIRECTION_LEADER
      responses:
        '200':
          description: 成功；响应为完整资源现状。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              example:
                code: OK
                message: Success
                data:
                  id: '201'
                  userId: '101'
                  studentNo: MOCK20260001
                  name: 示例同学
                  major: null
